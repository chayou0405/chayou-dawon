# Render.com Blueprint: one free web service that serves the game and the realtime WebSocket (/ws)
services:
  - type: web
    name: chayou-dawon
    runtime: node
    plan: free
    autoDeploy: true   # redeploy on every push to main
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: CAP
        value: "88"
      # visitor statistics are saved to the "stats" branch of this repo: a fine-grained GitHub token for this
      # repository with "Contents: Read and write". Without it the counts are kept in memory only.
      - key: STATS_GITHUB_TOKEN
        sync: false
