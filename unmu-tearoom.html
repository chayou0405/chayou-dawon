<title>차요우 다원</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed WebGL scene at dusk; a thin HUD in the corners keeps the view open */
:root{
  --ink:#f3ebde;
  --muted:#cdbfa9;
  --glass:rgba(26,19,16,.56);
  --line:rgba(243,235,222,.18);
  --lacquer:#b24a32;
  --jade:#a6c9a4;
  --bg:#1c1613;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#c.dragging{cursor:grabbing}
#c.over-seat{cursor:pointer}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px))}
.top,.bottom{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.bottom{align-items:flex-end}
.brand{pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:4px;padding:10px 14px 11px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;line-height:1.15;display:flex;align-items:baseline;gap:8px}
.brand h1 small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:.2em}
.brand p{margin:4px 0 0;font-size:12px;color:var(--muted);letter-spacing:.02em}
.brand p{display:none}
#netInfo{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-body);font-weight:500;font-size:11.5px;letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.brand h1{flex-wrap:wrap;row-gap:2px}
#netInfo:before{content:'';width:7px;height:7px;border-radius:50%;background:#888;flex:none}
#netInfo[data-state=connected]:before{background:var(--jade)}#netInfo[data-state=connecting]:before,#netInfo[data-state=reconnecting]:before{background:#e0a24f}#netInfo[data-state=failed]:before,#netInfo[data-state=full]:before{background:#d0584a}
.actions{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:4px;
  padding:9px 14px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-height:40px}
button:hover{border-color:rgba(243,235,222,.4)}
button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
button.primary{background:var(--lacquer);border-color:transparent;color:#fff8ef}
button:disabled{opacity:.5;cursor:default}
.status{pointer-events:auto;display:flex;flex-direction:column;gap:6px;max-width:min(460px,100%);min-width:0}
.chip{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--glass);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--jade);flex:none}
.chip.busy .dot{background:#e0a24f;box-shadow:0 0 8px #e0a24f}
.hint{font-size:12px;color:var(--muted);line-height:1.55;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.hint kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--ink)}
#toast{position:fixed;left:50%;top:max(84px,calc(env(safe-area-inset-top,0px) + 76px));transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);
  border-radius:4px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;backdrop-filter:blur(8px)}
#toast.show{opacity:1}
[hidden]{display:none!important}
#lanternPanel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(14,10,8,.5);padding:16px;z-index:5}
.hanji{width:100%;max-width:400px;padding:22px 20px 18px;border-radius:3px;color:#3a2414;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 40%),repeating-linear-gradient(83deg,rgba(150,110,60,.05) 0 2px,transparent 2px 7px),#efe2c2;
  box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 40px rgba(160,120,60,.25)}
.hanji h2{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:.06em}
.hanji p{margin:0;font-size:12.5px;color:#6a5034}
.hanji button{background:rgba(90,60,30,.08);color:#3a2414;border-color:rgba(90,60,30,.3)}
.hanji button.primary{background:#a8322a;color:#fbefd8;border-color:transparent}
.lkind{display:flex;gap:6px}.lkind button{flex:1}.lkind button.on{background:#3a2414;color:#f3e6c8}
#lanternText{font-family:var(--f-display);font-size:18px;line-height:1.7;color:#2a180c;background:transparent;border:1px dashed rgba(90,60,30,.4);border-radius:2px;padding:10px 12px;resize:none;min-height:110px}
#lanternText:focus{outline:2px solid rgba(168,50,42,.5);outline-offset:1px}
.lrow{display:flex;gap:8px;justify-content:flex-end}
#fullPanel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(14,10,8,.6);padding:16px;z-index:7}
#fullPanel .sheet{background:#231a15;border:1px solid var(--line);border-radius:6px;padding:20px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
#fullPanel h2{margin:0;font-family:var(--f-display);font-size:20px}#fullPanel p{margin:0;color:var(--muted);font-size:13px}#fullPanel .gpick{display:flex}#fullPanel .gpick button{flex:1;min-height:44px}
#genderPanel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(14,10,8,.5);padding:16px;z-index:6}
#genderPanel .sheet{background:#231a15;border:1px solid var(--line);border-radius:6px;padding:20px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
#genderPanel h2{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:.06em}
#genderPanel p{margin:0;color:var(--muted);font-size:13px}
#genderPanel .gpick{display:flex;gap:10px}#genderPanel .gpick button{flex:1;min-height:48px;font-size:15px}
#teaPanel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(14,10,8,.55);padding:16px;z-index:5}
#teaPanel .sheet{background:#231a15;border:1px solid var(--line);border-radius:6px;padding:18px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto}
#teaPanel h2{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:.06em}
#teaPanel p{margin:0;color:var(--muted);font-size:12.5px}
.teaList{display:grid;gap:8px}
.teaItem{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:10px 12px;background:rgba(255,255,255,.04)}
.teaItem.on{border-color:var(--jade);background:rgba(166,201,164,.12)}
.teaItem .sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.teaItem b{display:block;font-size:14.5px;font-family:var(--f-display)}
.teaItem span{font-size:12px;color:var(--muted)}
#moodBar{position:fixed;left:50%;bottom:max(84px,calc(env(safe-area-inset-bottom,0px) + 80px));transform:translateX(-50%);display:flex;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 8px;backdrop-filter:blur(8px);z-index:4}
#moodBar button{font-size:24px;min-height:44px;min-width:44px;padding:4px;border-radius:999px;background:transparent;border:none}
#moodBar button:hover{background:rgba(255,255,255,.1)}
#brewCap{position:fixed;left:50%;bottom:max(84px,calc(env(safe-area-inset-bottom,0px) + 80px));transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);border-radius:4px;padding:8px 14px;font-size:13.5px;max-width:calc(100% - 32px);text-align:center;backdrop-filter:blur(8px);pointer-events:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:14px;background:var(--bg);font-family:var(--f-display);font-size:18px;letter-spacing:.12em;color:var(--muted);transition:opacity .8s}
#loading small{font-family:var(--f-body);font-size:12px;letter-spacing:.04em}
#loading .lamp{width:96px;height:120px;overflow:visible}
#loading .lamp-flame{transform-origin:60px 70px;transform-box:view-box;animation:flicker 1.7s ease-in-out infinite}
#loading .lamp-glow{transform-origin:60px 62px;transform-box:view-box;animation:glow 2.3s ease-in-out infinite}
@keyframes flicker{0%{transform:scale(1,1) skewX(0deg);opacity:1}18%{transform:scale(.94,1.06) skewX(-3deg);opacity:.92}35%{transform:scale(1.04,.95) skewX(2deg);opacity:1}52%{transform:scale(.97,1.08) skewX(-1.5deg);opacity:.88}70%{transform:scale(1.02,.97) skewX(3deg);opacity:.97}86%{transform:scale(.96,1.03) skewX(-2deg);opacity:.9}100%{transform:scale(1,1) skewX(0deg);opacity:1}}
@keyframes glow{0%,100%{transform:scale(1);opacity:.9}30%{transform:scale(1.07);opacity:1}55%{transform:scale(.95);opacity:.78}80%{transform:scale(1.04);opacity:.95}}
#loading.done{opacity:0;pointer-events:none}
@media (max-width:560px){
  .top{flex-wrap:nowrap;align-items:center}
  .top .actions{flex-wrap:nowrap;flex:none}
  .top .actions button{white-space:nowrap;padding:7px 10px}
  .top .brand{flex:1 1 auto;min-width:0}
  .desk-only{display:none!important}
  .brand{padding:8px 12px 9px}
  .brand h1 small{font-size:10.5px;letter-spacing:.12em}
  #toast{font-size:12px;padding:6px 12px;top:max(70px,calc(env(safe-area-inset-top,0px) + 64px))}
  .brand h1{font-size:15px}
  .brand p{font-size:11px}
  button{padding:8px 11px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){#toast,#loading{transition:none}#loading .lamp-flame,#loading .lamp-glow{animation-duration:6s}}
</style>

<canvas id="c" tabindex="0" aria-label="차요우 다원 3D 공간"></canvas>
<div id="ui">

    <div class="brand">
      <h1>차요우 다원 <small>茶友茶园</small><span id="netInfo" aria-live="polite">접속 중…</span></h1>

</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="brewCap" hidden></div>
<div id="moodBar" hidden></div>
<div id="teaPanel" hidden><div class="sheet" role="dialog" aria-label="찻장">
  <h2>찻장</h2><p>오늘 우릴 차를 하나 고르세요. 차를 가지고 있으면 팽주석에 앉아 차를 우릴 수 있어요.</p>
  <div class="teaList" id="teaList"></div>

  <div class="lkind" role="radiogroup" aria-label="무엇을 적을까요"><button type="button" data-k="wish" class="on" role="radio" aria-checked="true">소원</button><button type="button" data-k="worry" role="radio" aria-checked="false">근심</button></div>
  <textarea id="lanternText" maxlength="40" rows="4" placeholder="여기에 적어 주세요 (40자까지)"></textarea>

<div id="fullPanel" hidden><div class="sheet" role="alertdialog" aria-labelledby="fullTitle">
  <h2 id="fullTitle">만원이에요</h2><p id="fullText"></p><div class="gpick"><button type="button" id="fullGo" hidden></button></div></div></div>

  <div class="gpick"><button type="button" data-g="f">여성</button><button type="button" data-g="m">남성</button></div></div></div>
<div id="loading"><svg class="lamp" viewBox="0 0 120 150" aria-hidden="true">
  <defs><radialGradient id="lgGlow"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/><stop offset=".45" stop-color="#ff9d3c" stop-opacity=".18"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
    <radialGradient id="lgFlame" cx=".5" cy=".72" r=".6"><stop offset="0" stop-color="#fffbe8"/><stop offset=".35" stop-color="#ffe28a"/><stop offset=".75" stop-color="#ff9a2e"/><stop offset="1" stop-color="#e2541c" stop-opacity=".0"/></radialGradient>
    <linearGradient id="lgDish" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#b98a57"/><stop offset="1" stop-color="#6b4528"/></linearGradient></defs>
  <circle class="lamp-glow" cx="60" cy="62" r="56" fill="url(#lgGlow)"/>
  <g class="lamp-flame"><path d="M60 30 C67 44 72 54 70 64 C68 73 52 73 50 64 C48 54 53 44 60 30Z" fill="url(#lgFlame)"/><path d="M60 50 C63 57 64 61 63 65 C62 69 58 69 57 65 C56 61 57 57 60 50Z" fill="#fff8e0" opacity=".85"/></g>
  <rect x="58.6" y="66" width="2.8" height="9" rx="1.2" fill="#2a1c12"/>
  <path d="M26 78 Q60 72 94 78 Q90 96 60 98 Q30 96 26 78Z" fill="url(#lgDish)"/><ellipse cx="60" cy="78" rx="34" ry="5" fill="#3b2617"/><ellipse cx="60" cy="78" rx="28" ry="3.4" fill="#c69a4a" opacity=".55"/>
  <path d="M50 98 L46 128 Q60 134 74 128 L70 98Z" fill="#7a5232"/><ellipse cx="60" cy="130" rx="26" ry="6" fill="#5a3a22"/><ellipse cx="60" cy="128.5" rx="26" ry="5" fill="#8a6038"/></svg><span>다실에 불을 밝히는 중</span><small id="loadPct"></small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Water.js"></script>
<script>
(() => {
'use strict';
const isTouch = matchMedia('(pointer:coarse)').matches;
const $ = id => document.getElementById(id);
const canvas = $('c');
if (typeof THREE === 'undefined') { $('loading').firstElementChild.textContent = '3D 엔진을 불러오지 못했어요. 새로고침해 주세요.'; return; }
const V3 = THREE.Vector3;

/* ---------- math & noise ---------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry(20261102);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const ease=t=>t*t*(3-2*t);
const seg=(t,a,b)=>ease(clamp((t-a)/(b-a),0,1));
const lerpAngle=(a,b,t)=>{const d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t;};
function hash2(x,y,s){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,y,s=0){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s=0,o=4){let t=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){t+=a*vnoise(x*f,y*f,s+i*17);n+=a;f*=2.03;a*=.5;}return t/n;}

/* ---------- renderer ---------- */
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }
catch(e){ $('loading').firstElementChild.textContent='이 기기에서는 3D(WebGL)를 열 수 없어요.'; return; }
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch?1.5:2));
if(!isTouch){ renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; }
const scene=new THREE.Scene();
const FOG=0xb9a898;
scene.fog=new THREE.Fog(FOG,110,800);
const camera=new THREE.PerspectiveCamera(isTouch?62:55,1,0.1,1600);
camera.layers.enable(1); // layer 1 = interior detail, kept out of the lake reflection

/* ---------- textures ---------- */
const loadMgr=new THREE.LoadingManager();
let assetsReady=false;
loadMgr.onProgress=(u,l,t)=>{$('loadPct').textContent=`CC0 스캔 텍스처 ${l}/${t}`;};
loadMgr.onLoad=()=>{assetsReady=true;};
loadMgr.onError=()=>{};
const texLoader=new THREE.TextureLoader(loadMgr);
const maxAniso=renderer.capabilities.getMaxAnisotropy();
function scanTex(path,rx,ry){const t=texLoader.load(path);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=Math.min(8,maxAniso);return t;}
// ambientCG photo-scanned materials (CC0): Rock020, WoodFloor043, Grass001
const rockMap=scanTex('tex/rock_color.jpg',5,2.5), rockNorm=scanTex('tex/rock_normal.jpg',5,2.5);
const woodNorm=scanTex('tex/wood_normal.jpg',12,12);
const woodMap=(()=>{const t=canvasTex(1024,1024,(g,w,h)=>{const rows=8,rh=h/rows;
  for(let r=0;r<rows;r++){let x=-rnd()*400;
    while(x<w){const len=380+rnd()*420,hue=26+rnd()*4,l=28+rnd()*4;g.fillStyle=`hsl(${hue},${15+rnd()*5}%,${l}%)`;g.fillRect(x,r*rh,len,rh);
      for(let k=0;k<26;k++){const yy=r*rh+rnd()*rh,a=.05+rnd()*.07;g.strokeStyle=rnd()<.5?`rgba(60,45,35,${a})`:`rgba(200,180,160,${a*.6})`;g.lineWidth=.8+rnd()*1.6;g.beginPath();g.moveTo(x,yy);
        g.bezierCurveTo(x+len*.3,yy+(rnd()-.5)*5,x+len*.7,yy+(rnd()-.5)*5,x+len,yy+(rnd()-.5)*3);g.stroke();}
      g.fillStyle='rgba(30,22,16,.3)';g.fillRect(x,r*rh,1.5,rh);x+=len;}
    g.fillStyle='rgba(30,22,16,.35)';g.fillRect(0,r*rh,w,1.5);}},5,5);return t;})();

      if(A.t>=1.4){A.i++;A.t=0;}}
